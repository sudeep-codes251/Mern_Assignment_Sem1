
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive photo gallery built with CSS Grid.">
    <meta name="author" content="Sudeep Saxena">
    <title>Campus Gallery | Assignment 08</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="page-heading">
        <p class="eyebrow">BTECH YEAR 1 / HTML & CSS / ASSIGNMENT 08</p>
        <h1>Campus Photo Gallery</h1>
        <p>Explore beautiful places, nature and campus life.</p>
    </header>

    <main class="container">
        <section class="gallery-section">
            <h2>My Favourite Moments</h2>
            <p class="section-description">
                A collection of nine beautiful photographs.
            </p>

            <div class="gallery-grid">

                <figure class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700"
                         alt="Beautiful green mountain landscape">
                    <figcaption>Mountain View</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=700"
                         alt="Peaceful lake surrounded by mountains">
                    <figcaption>Peaceful Lake</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=700"
                         alt="Sunlight coming through a green forest">
                    <figcaption>Green Forest</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=700"
                         alt="Mountain valley with a beautiful lake">
                    <figcaption>Nature Escape</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=700"
                         alt="Golden sunlight during sunrise">
                    <figcaption>Golden Sunrise</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=700"
                         alt="Ocean waves reaching the beach">
                    <figcaption>Ocean Waves</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1511497584788-876760111969?w=700"
                         alt="Tall trees in a peaceful forest">
                    <figcaption>Forest Life</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=700"
                         alt="Beautiful outdoor landscape under the sky">
                    <figcaption>Open Landscape</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=700"
                         alt="Green hills and countryside scenery">
                    <figcaption>Green Hills</figcaption>
                </figure>

            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Sudeep Saxena | Campus Gallery</p>
    </footer>

</body>
</html>
