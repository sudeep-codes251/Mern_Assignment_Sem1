<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Flexbox centred login form">
    <meta name="author" content="Sudeep saxena">
    <title>Campus Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <main class="login-stage">

        <form class="login-card" action="#" method="post">

            <p class="eyebrow">CAMPUS STORE</p>

            <h1>Welcome Back</h1>

            <p class="muted">
                Sign in to explore student essentials.
            </p>

            <label for="email">Email</label>
            <input
                id="email"
                name="email"
                type="email"
                placeholder="saxenasudeep40@gmail.com"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                placeholder="657166"
                minlength="6"
                required
            >

            <button class="button full" type="submit">
                Log In
            </button>

            <p class="small">
                New here? <a href="#">Create an account</a>
            </p>

        </form>

    </main>

</body>
</html>
